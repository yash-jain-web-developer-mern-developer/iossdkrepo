# 3 app replicas behind nginx, one Postgres, one Redis. Used for multi-replica + chaos testing.
#   docker compose -f infra/docker-compose.cluster.yml up -d
# LB on http://localhost:8088
name: mobiad-cluster
x-app: &app
  image: mobiad:local
  depends_on: [postgres, redis, redpanda]
  environment:
    NODE_ENV: development
    MOBIAD_SECRET: cluster-test-secret-0123456789abcdef0123
    DATABASE_URL: postgres://postgres:dev@postgres:5432/mobiad
    REDIS_URL: redis://redis:6379
    PUBLIC_URL: http://127.0.0.1:8088
    TRUST_PROXY_HOPS: "1"
    RATE_LIMIT_PER_MIN: "100000000"
    # Set KAFKA_BROKERS= (empty) to run WITHOUT Kafka (in-memory queue) for comparison.
    KAFKA_BROKERS: "${KAFKA_BROKERS-redpanda:9092}"
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: mobiad }
    ports: ["55432:5432"]
  redis:
    image: redis:7
    ports: ["56379:6379"]
  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command: redpanda start --smp 1 --memory 768M --overprovisioned --node-id 0 --mode dev-container --kafka-addr PLAINTEXT://0.0.0.0:9092 --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports: ["59092:9092"]
  app1: { <<: *app }
  app2: { <<: *app }
  app3: { <<: *app }
  lb:
    image: nginx:1.27-alpine
    depends_on: [app1, app2, app3]
    ports: ["8088:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
