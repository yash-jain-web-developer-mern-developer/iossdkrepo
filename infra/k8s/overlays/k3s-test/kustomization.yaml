# Test overlay for a local k3s cluster: PRODUCTION mode (all production config guards active) against in-cluster test dependencies.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - deps.yaml
images:
  - { name: ghcr.io/your-org/mobiad, newName: mobiad, newTag: local }
patches:
  - target: { kind: ConfigMap, name: mobiad-config }
    patch: |-
      - { op: replace, path: /data/PUBLIC_URL, value: "https://ads.test.local" }
      - { op: replace, path: /data/KAFKA_REPLICATION, value: "1" }
      - { op: replace, path: /data/DATABASE_SSL, value: "false" }
      - { op: replace, path: /data/CORS_ORIGINS, value: "https://ads.test.local" }
      - { op: replace, path: /data/RATE_LIMIT_PER_MIN, value: "100000000" }
      - { op: add, path: /data/MIN_PAYOUT_USD, value: "10" }   # test traffic earns little; keep the production default (50) in real overlays
  - target: { kind: HorizontalPodAutoscaler, name: mobiad }
    patch: |-
      - { op: replace, path: /spec/maxReplicas, value: 6 }   # one small node: 30 pods would starve themselves (seen in testing)
# Secrets are generated by ./make-secrets.sh into secrets.env (gitignored): never commit secret values.
secretGenerator:
  - name: mobiad-secrets
    namespace: mobiad
    options: { disableNameSuffixHash: true }
    envs: [secrets.env]
