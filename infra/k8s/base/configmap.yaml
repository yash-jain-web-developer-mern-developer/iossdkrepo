# Non-secret configuration. Secrets (MOBIAD_SECRET, DATABASE_URL, REDIS_URL, KAFKA_BROKERS, METRICS_TOKEN, SMTP_URL and,
# when payments are on, STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET) live in the Secret `mobiad-secrets`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mobiad-config
  namespace: mobiad
data:
  NODE_ENV: production
  PUBLIC_URL: https://ads.example.com
  TRUST_PROXY_HOPS: "1"              # number of reverse proxies in front (ingress controller = 1)
  PAYMENTS_MODE: none                # none | stripe  (test is refused in production)
  INVITE_ONLY: "true"                # private beta: sign-up needs an admin-issued invite code (default in production)
  PAYOUTS_MODE: manual               # manual | stripe_connect (Stripe pays publishers; needs STRIPE_SECRET_KEY and Connect enabled)
  AUTO_PAYOUT_MAX_USD: "0"           # stripe_connect: payouts up to this amount are sent automatically (0 = admin sends every payout)
  PAYOUT_HOLD_DAYS: "7"              # earnings of the last N days are not payable yet (chargebacks arrive first)
  MAIL_FROM: "MobiAd <no-reply@example.com>"
  KAFKA_TOPIC: mobiad.events
  KAFKA_PARTITIONS: "6"
  KAFKA_REPLICATION: "3"
  RATE_LIMIT_PER_MIN: "600"
  PUBLISHER_SHARE: "0.7"
  DATABASE_SSL: "true"               # verify the server certificate (add the CA via NODE_EXTRA_CA_CERTS if private)
  CORS_ORIGINS: https://ads.example.com
