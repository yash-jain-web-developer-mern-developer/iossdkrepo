apiVersion: v1
kind: Service
metadata:
  name: mobiad
  namespace: mobiad
  labels: { app: mobiad }
spec:
  selector: { app: mobiad }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mobiad
  namespace: mobiad
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: mobiad }
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - { type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } } }
  behavior:
    scaleUp: { stabilizationWindowSeconds: 0, policies: [{ type: Percent, value: 100, periodSeconds: 30 }] }
    scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Pods, value: 1, periodSeconds: 60 }] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mobiad
  namespace: mobiad
spec:
  minAvailable: 2
  selector: { matchLabels: { app: mobiad } }
