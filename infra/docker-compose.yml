# Local stack: app + real Postgres + Redis. Redpanda/ClickHouse are for the roadmap (not used by the app yet).
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: mobiad }
    ports: ["${PG_PORT:-5432}:5432"]
  redis:
    image: redis:7
    ports: ["${REDIS_PORT:-6379}:6379"]
  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command: redpanda start --smp 1 --memory 512M --overprovisioned --node-id 0 --kafka-addr PLAINTEXT://0.0.0.0:9092 --advertise-kafka-addr PLAINTEXT://redpanda:9092
    ports: ["9092:9092"]
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports: ["8123:8123"]
  mobiad:
    build: ..
    depends_on: [postgres, redis, redpanda]
    environment:
      NODE_ENV: development
      MOBIAD_SECRET: dev-only-secret-change-me-0123456789abcdef
      DATABASE_URL: postgres://postgres:dev@postgres:5432/mobiad
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      PUBLIC_URL: http://localhost:8080
    ports: ["8080:8080"]
