name: ios
# Builds the Swift SDK and the SwiftUI demo app on a Mac runner and runs the SDK against a live MobiAd server.
# This is the only place iOS code is compiled with UIKit/SwiftUI; local Linux checks cover the SDK's networking logic only.
on:
  push: { branches: [main], paths: ["sdk/ios/**", "ios-demo-app/**", ".github/workflows/ios.yml"] }
  pull_request: { paths: ["sdk/ios/**", "ios-demo-app/**", ".github/workflows/ios.yml"] }
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the SDK package for iOS (UIKit viewability tracker included)
        run: xcodebuild build -scheme MobiAd -destination 'generic/platform=iOS Simulator'
        working-directory: sdk/ios
      - name: SDK smoke test against a live server (macOS)
        run: |
          node scripts/sdk-smoke-server.mjs 8190 > server.log 2>&1 &
          for _ in $(seq 1 30); do grep -q READY server.log && break; sleep 1; done
          read -r _ url app < <(grep READY server.log | sed 's/host.docker.internal/127.0.0.1/')
          swiftc -parse-as-library sdk/ios/Sources/MobiAd/MobiAd.swift sdk/ios/Tests/smoke.swift -o smoke
          ./smoke "$url" "$app"
      - name: Build the demo app
        run: |
          brew install xcodegen
          cd ios-demo-app && xcodegen
          xcodebuild build -project MobiAdDemo.xcodeproj -scheme MobiAdDemo -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
