name: ios
# Builds the Swift SDK on a Mac runner and runs the SDK against a live MobiAd server.
# This is the only place iOS code is compiled with UIKit/SwiftUI; local Linux checks cover the SDK's networking logic only.
# On failure each step publishes the tail of its log as a workflow annotation (readable without logging in to GitHub).
on:
  push: { branches: [main], paths: ["sdk/ios/**", ".github/workflows/ios.yml", "scripts/sdk-smoke-server.mjs"] }
  pull_request: { paths: ["sdk/ios/**", ".github/workflows/ios.yml"] }
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the SDK package for iOS (UIKit viewability tracker included)
        working-directory: sdk/ios
        run: |
          set -o pipefail
          xcodebuild build -scheme MobiAd -destination 'generic/platform=iOS Simulator' 2>&1 | tee ../../sdk-build.log | tail -5
      - name: SDK smoke test against a live server (macOS)
        run: |
          annotate() { echo "::error title=$1::$(tail -n 40 "$2" 2>/dev/null | awk '{printf "%s%%0A", $0}')"; }
          SMOKE_HOST=127.0.0.1 node scripts/sdk-smoke-server.mjs 8190 > server.log 2>&1 &
          for _ in $(seq 1 40); do grep -q READY server.log && break; sleep 1; done
          line=$(grep READY server.log | sed 's/host.docker.internal/127.0.0.1/')
          url=$(echo "$line" | awk '{print $2}'); app=$(echo "$line" | awk '{print $3}')
          echo "server: $url app: $app"
          if ! swiftc -parse-as-library sdk/ios/Sources/MobiAd/MobiAd.swift sdk/ios/Tests/smoke.swift -o smoke > swiftc.log 2>&1; then annotate "swiftc failed" swiftc.log; exit 1; fi
          if ! ./smoke "$url" "$app" > smoke.log 2>&1; then annotate "smoke test failed" smoke.log; annotate "server log" server.log; exit 1; fi
          tail -n 5 smoke.log
